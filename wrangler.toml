name = "voluntai"
main = "dist/_worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "service-finder-db"
database_id = "<fill-in-after-wrangler-d1-create>"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "voluntai-images"

[[kv_namespaces]]
binding = "CACHE"
id = "<fill-in-after-wrangler-kv-create>"

[[kv_namespaces]]
binding = "SESSION"
id = "<fill-in-after-wrangler-kv-create-session>"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
APP_BASE_URL = "https://voluntai.com"
